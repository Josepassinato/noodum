# Example reverse proxy. Replace the server name, certificate paths, the
# static-file root, and the loopback port (it must match APP_PORT, default 8080).
# This file is not used by docker compose. Compose is loopback-only and has no TLS.

server {
    listen 80;
    server_name noodum.example.org;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    server_name noodum.example.org;
    ssl_certificate /etc/letsencrypt/live/noodum.example.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/noodum.example.org/privkey.pem;

    root /var/www/noodum/public;
    location = / { try_files /index.html =404; }
    location = /credits { try_files /credits.html =404; }
    location = /manifesto { try_files /manifesto.html =404; }
    location = /privacy { try_files /privacy.html =404; }
    location = /terms { try_files /terms.html =404; }
    location = /agent-rules { try_files /agent-rules.html =404; }
    location = /public/site.css {
        alias /var/www/noodum/public/site.css;
        default_type text/css;
        expires 1h;
    }
    location = /public/language.js {
        alias /var/www/noodum/public/language.js;
        default_type application/javascript;
        expires 1h;
    }
    location = /public/launch.css {
        alias /var/www/noodum/public/launch.css;
        default_type text/css;
        expires 1h;
    }
    location /public/media/ {
        alias /var/www/noodum/public/media/;
        expires 24h;
        add_header Cache-Control "public";
    }
    location = /healthz { add_header Content-Type text/plain; return 200 'ok\n'; }

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 120s;
        client_max_body_size 25m;
    }
}
