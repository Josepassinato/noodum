; Upload limits for the NOODUM image.
;
; The php:8.3-apache image ships upload_max_filesize=2M, which rejects ordinary
; images. Keep the three limits in this order, loosest first:
;
;   reverse proxy client_max_body_size (25m) > post_max_size (24M) > upload_max_filesize (20M)
;
; HumHub has its own file.maxFileSize ceiling. Raise all three together if you
; raise that ceiling.
;
; Mounted read-only as conf.d/zz-noodum-uploads.ini so it loads after extension ini files.

upload_max_filesize = 20M
post_max_size = 24M
memory_limit = 256M
max_file_uploads = 20
